services:
  anywiki:
    build: .
    container_name: anywiki
    ports:
      - "${PORT:-4000}:4000"      # 바깥 포트는 PORT 로 바꿈 (예: PORT=8080 docker compose up -d)
    environment:
      COLOR: "${COLOR:-#3b5bdb}"   # 위키 머리글 색
      UPDATE_NOTICE: "${UPDATE_NOTICE:-on}"   # 새 판 알림(켤 때 한 줄, 알리기만 함)
    volumes:
      - ./anywiki-data/wikis:/kit/wikis   # 위키 데이터
      # 0.1 에서 올라왔다면 아래 줄의 주석을 풀어 한 번 켜면 wikis/opennamu 로 복사된다
      # - ./anywiki-data/wiki:/kit/wiki
    restart: unless-stopped
