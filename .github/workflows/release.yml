# CHANGELOG.md 가 바뀌어 main 에 올라오면, 아직 릴리스가 없는 판마다 태그와 GitHub 릴리스를 만든다.
# (AI 작업 환경은 태그 푸시·릴리스 API 를 쓸 수 없어서, GitHub 가 대신 만든다.)
name: 릴리스
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md, .gitattributes, .github/release.py, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/release.py
        env:
          GH_TOKEN: ${{ github.token }}
